# Service du build statique (issue #16).
#
# Deux régimes de cache, et la distinction est load-bearing : Vite empreinte le
# nom des fichiers qu'il produit (`dist/assets/index-a1b2c3.js`), mais copie
# ceux de `public/` VERBATIM — `models/scene.glb` et `draco/*` gardent donc un
# nom stable d'un déploiement à l'autre. Les mettre en cache « longtemps », le
# réflexe pour de gros fichiers, servirait l'ANCIEN modèle pendant un an après
# un nouvel export, sans aucun moyen de l'invalider.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Un portfolio ne rend pas 3 Mo de texte : la compression sert le JS, le CSS
    # et le HTML. Le `.glb` (draco + webp) et les images sont déjà compressés —
    # les repasser à gzip brûle du CPU pour quelques octets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # `index.html` référence les fichiers empreintés : le mettre en cache, c'est
    # servir les anciens noms après une mise en ligne. Il se revalide toujours.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fichiers empreintés : leur nom change à chaque contenu, donc immuables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Le modèle — nom STABLE, donc jamais immuable. nginx ne connaît pas le type
    # glTF binaire ; sans lui, le navigateur reçoit `application/octet-stream`.
    location ~* \.glb$ {
        default_type model/gltf-binary;
        # Un jour, puis une requête conditionnelle qui répond 304 sans un octet :
        # le cache reste long en pratique, et un nouvel export arrive quand même.
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # Le décodeur draco, même raison : nom stable, et le wasm a besoin de son
    # type pour être compilé en flux (`WebAssembly.instantiateStreaming`).
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location ~* \.(png|jpe?g|webp|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    # L'app est une page unique : toute URL inconnue rend `index.html` plutôt
    # qu'un 404 nginx. Les liens profonds du projet sont des paramètres
    # (`?stop=`, `?debug`) et passent déjà par `/`, mais un 404 sur un chemin
    # tapé à la main serait une porte fermée sans raison.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
