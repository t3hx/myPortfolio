# CI — sur chaque PR, et déploiement à chaque fusion sur `main` (trunk-based).
#
# Ce fichier n'appelle que le pipeline commun de `t3hx/workflows` : il ne
# contient aucune étape. Le contrat reste le même qu'avant : le workflow dit
# CE QUI tourne, le `package.json` dit COMMENT (`pnpm run --if-present`).
# Toute particularité de ce dépôt vit dans ses scripts, ou dans un workflow à
# part comme `render-diff.yml`, jamais dans le pipeline commun.
#
# Le pipeline se modifie dans `t3hx/workflows`, jamais ici. Ce dépôt l'appelle
# par son tag `v1` : un changement du dépôt commun n'arrive ici que lorsque
# `v1` est déplacé.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Une PR : une nouvelle poussée annule le run en vol. `main` : les mises en
# ligne passent en file, jamais interrompues — une mise en ligne à moitié faite
# est pire qu'une mise en ligne en retard.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: t3hx/workflows/.github/workflows/verify.yml@v1
    with:
      node-version: '22'

  deploy:
    if: github.event_name == 'push'
    needs: verify
    uses: t3hx/workflows/.github/workflows/deploy.yml@v1
    # Un workflow appelé ne peut pas avoir plus de droits que son appelant
    permissions:
      contents: write
      packages: write
    with:
      image: ghcr.io/t3hx/myportfolio
      prod-url: ${{ vars.PROD_URL }}
      origin-ip: ${{ vars.VPS_TAILSCALE_IP }}
    secrets: inherit
