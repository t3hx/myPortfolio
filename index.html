<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio — Thibault Dubois</title>
    <!--
      Le triangle du logo, servi tel quel (#29). Il vaut pour les DEUX
      expériences : c'est le même portfolio, et un onglet ne sait pas laquelle
      on visite. Il est déclaré ici et pas monté par React parce qu'un onglet
      s'affiche avant la première ligne de JavaScript.

      `type` est explicite : sans lui, certains navigateurs demandent d'abord un
      `/favicon.ico` qui n'existe pas, et se rabattent sur le SVG après un 404
      dans la console.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Typo du design system « Lueur » (src/styles/tokens.css) : Space Grotesk
         (UI) + Newsreader italique (la voix). Mêmes graisses que les maquettes.

         IBM Plex Mono s'y ajoute avec le site classique (#29), où la chasse
         fixe n'est pas un effet mais une CONTRAINTE : le nom d'accueil se
         déchiffre caractère par caractère, et en chasse proportionnelle chaque
         glyphe tiré au sort change la largeur du mot — le nom gigote au lieu
         de se résoudre. Elle sert aussi les méta, les kickers et les périodes,
         comme dans les maquettes. La scène 3D, elle, garde la mono du système
         (`ui-monospace`) : elle n'a pas besoin d'une requête réseau de plus
         avant sa première image. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
