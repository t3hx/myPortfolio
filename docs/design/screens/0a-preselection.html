<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sélection de version — Portfolio 3D (référence design)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<style>
.presel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:40px; pointer-events:auto;
  background:radial-gradient(1100px 750px at 50% 115%, #26190F, var(--ink) 70%); }
/* La forme du triangle et `logo-breathe` vivent dans tokens.css (`.logo`,
   issue #65) : ici, seulement ce qui est propre à cet écran. */
.presel__logo { width:16px; height:16px; animation:logo-breathe 2.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .presel__logo { animation:none !important; opacity:1; filter:drop-shadow(0 0 6px rgba(var(--glow-rgb),.55)); } }
.presel__eyebrow { font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:rgba(var(--cream-rgb),.5); }
.presel__title { font-family:var(--font-voice); font-style:italic; font-size:30px; font-weight:400; color:#F2E9DA; margin:0; }
.presel__cards { display:flex; gap:24px; }
.presel-card { width:340px; text-align:left; background:linear-gradient(160deg, rgba(var(--ink-glass),.66), rgba(var(--ink-glass),.54));
  border:1px solid rgba(var(--cream-rgb),.14); border-radius:var(--r-bubble); padding:26px 28px 22px; cursor:pointer;
  box-shadow:0 14px 44px rgba(0,0,0,.38); font-family:var(--font-ui); color:var(--cream);
  transition:border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out); }
/* Aucun halo au repos (décision 2026-08-10, remplace le « halo d'office ») :
   il s'allume sur la carte survolée/focusée et respire comme le logo du
   preloader (2,6 s ease-in-out). */
.presel-card:hover, .presel-card:focus-visible {
  border-color:rgba(var(--glow-deep-rgb),.55);
  animation:presel-halo 2.6s ease-in-out infinite; }
@keyframes presel-halo {
  0%, 100% { box-shadow:0 0 0 1.5px rgba(var(--glow-deep-rgb),.2), 0 0 22px 2px rgba(var(--glow-deep-rgb),.2), 0 14px 44px rgba(0,0,0,.38); }
  50% { box-shadow:0 0 0 1.5px rgba(var(--glow-deep-rgb),.34), 0 0 38px 4px rgba(var(--glow-deep-rgb),.38), 0 14px 44px rgba(0,0,0,.38); } }
@media (prefers-reduced-motion: reduce) {
  .presel-card:hover, .presel-card:focus-visible {
    animation:none !important;
    box-shadow:0 0 0 1.5px rgba(var(--glow-deep-rgb),.3), 0 0 38px 4px rgba(var(--glow-deep-rgb),.34), 0 14px 44px rgba(0,0,0,.38); } }
.presel-card .bubble__text { margin:0 0 16px; font-size:17px; }
.presel-card__meta { font-family:ui-monospace,monospace; font-size:11px; color:rgba(var(--cream-rgb),.5); }
.presel__note { font-family:ui-monospace,monospace; font-size:11px; color:rgba(var(--cream-rgb),.4); }
</style>
</head>
<body>
<main class="stage">
    <div class="presel">
      <div style="display:flex; flex-direction:column; align-items:center; gap:18px;">
        <svg class="logo presel__logo" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5 H14 L8 13.5 Z"/></svg>
        <div class="presel__eyebrow">Portfolio — la visite d'une pièce</div>
        <h1 class="presel__title">Comment souhaitez-vous visiter ?</h1>
      </div>
      <div class="presel__cards">
        <button class="presel-card">
          <span class="bubble__kicker" style="margin-bottom:10px"><span class="bubble__dot"></span><span class="bubble__label" style="color:rgba(var(--cream-rgb),.8)">Expérience 3D</span></span>
          <p class="bubble__text">Entrez dans la pièce — la caméra vous guide d'objet en objet, au fil de la molette.</p>
          <span class="presel-card__meta">WebGL · ~20 Mo · souris, tactile ou clavier</span>
        </button>
        <button class="presel-card">
          <span class="bubble__kicker" style="margin-bottom:10px"><span class="bubble__dot" style="background:rgba(var(--cream-rgb),.45); box-shadow:none"></span><span class="bubble__label">Expérience classique</span></span>
          <p class="bubble__text">La même histoire, en une page légère — idéale en déplacement ou au lecteur d'écran.</p>
          <span class="presel-card__meta">HTML · instantané · accessible</span>
        </button>
      </div>
      <div class="presel__note">votre choix est mémorisé — modifiable à tout moment depuis le menu</div>
    </div>
</main>
</body>
</html>
