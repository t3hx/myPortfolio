<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le tiroir vide — Portfolio 3D (référence design)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
</head>
<body>
<!-- Fond : capture réelle de l'app avec PROJECTS vide (le dossier du .glb est
     masqué, le tiroir s'ouvre sur du vide). Pas un montage. -->
<main class="stage" style="background-image:url(../../renders/spikes/cabinet-drawer-empty.png)">
  <div class="overlay-root">
    <!-- AUCUN nouveau composant : c'est la bulle de la commode, à sa place
         habituelle (left 2,5 %, top 76 %, 300 px), avec une autre phrase.
         À zéro projet il n'y a aucun dossier à cliquer, donc aucune fiche ne
         s'ouvre jamais : le repli doit vivre là où l'utilisateur se trouve, et
         le système n'admet qu'un seul bloc de texte à la fois. -->
    <article class="bubble" data-variant="empty" style="left:2.5%; top:76%; max-width:300px;">
      <header class="bubble__kicker"><span class="bubble__dot"></span><span class="bubble__label">05 — La commode</span></header>
      <p class="bubble__text" style="margin:0">Le tiroir est vide pour l'instant. Les projets arrivent — le reste de la pièce se visite déjà.</p>
    </article>
  </div>
  <nav class="menu" aria-label="Menu">
    <svg class="logo menu__logo" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5 H14 L8 13.5 Z"/></svg>
    <div class="menu__rule menu__rule--head"></div>
    <a class="menu__link" href="#"><span>Accueil</span></a>
    <a class="menu__link" href="#"><span>Résumé</span></a>
    <a class="menu__link menu__link--active" href="#"><span>Projets</span></a>
    <div class="menu__rule menu__rule--mid"></div>
    <a class="menu__social" href="#" title="LinkedIn">in</a>
    <a class="menu__social" href="#" title="GitHub">gh</a>
    <div class="menu__lang"><span class="menu__lang-on">FR</span><span class="menu__lang-rule"></span><span class="menu__lang-off" role="button" tabindex="0">EN</span></div>
  </nav>
</main>
</body>
</html>
